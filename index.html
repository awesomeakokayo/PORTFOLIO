  <!-- Apply the saved appearance before first paint to avoid a light flash. -->
  <script>
    (function () {
      try {
        var raw = window.localStorage.getItem("awesome-appearance-level");
        var level = raw === null ? 0 : Number(raw);
        if (!isFinite(level)) level = 0;
        level = Math.max(0, Math.min(100, level));

        var root = document.documentElement;
        var t = level / 100;
        var surfaceMix = t;
        var light = [246, 245, 240];
        var night = [8, 11, 9];
        var rgb = light.map(function (value, index) {
          return Math.round(value + (night[index] - value) * surfaceMix);
        });
        var linear = function (channel) {
          var value = channel / 255;
          return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
        };
        var luminance =
          0.2126 * linear(rgb[0]) +
          0.7152 * linear(rgb[1]) +
          0.0722 * linear(rgb[2]);
        var dark = luminance < 0.179;
        root.dataset.rbTheme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";

        if (level > 0) {
          var hex =
            "#" +
            rgb
              .map(function (value) {
                return value.toString(16).padStart(2, "0");
              })
              .join("");

          var style = document.createElement("style");
          style.id = "rb-prepaint";
          style.textContent = "html,body{background:" + hex + "!important}";
          document.head.appendChild(style);

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", hex);
        }
      } catch (error) {
        /* Storage can be unavailable; the default light theme is fine. */
      }
    })();
  </script>
